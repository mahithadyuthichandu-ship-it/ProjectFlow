services:
  - type: web
    name: projectflow
    runtime: node
    plan: starter
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start:backend
    healthCheckPath: /api/health
    disk:
      name: projectflow-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/project_dashboard.db
